name: Bug report
description: Report a reproducible GASLESS problem. Do not report security vulnerabilities here.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include seed phrases, private keys, API credentials, full private logs, or other sensitive information.
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Solana Devnet, Solana Mainnet, Local, Not applicable]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and wallet context
      description: Product names and versions only; do not include wallet secrets or an unnecessary full address.
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      options: [Claim SOL, Recover Value, Burn, Swap, Send, Wallet connection, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove wallet identifiers, local paths, credentials, and personal information.
